<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 112" role="img" aria-label="Student Attendance Monitoring System crest">
  <title>Student Attendance Monitoring System crest</title>
  <defs>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a7fc1"/>
      <stop offset="1" stop-color="#0f3d68"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf5fd"/>
      <stop offset="1" stop-color="#7db4de"/>
    </linearGradient>
  </defs>

  <!-- Layered shield: navy outline / white gap / blue band / white core -->
  <path d="M50 2 L95 14 V55 C95 82 74 99 50 109 C26 99 5 82 5 55 V14 Z" fill="#0f3d68"/>
  <path d="M50 8 L90 19 V55 C90 79 72 94 50 103 C28 94 10 79 10 55 V19 Z" fill="#ffffff"/>
  <path d="M50 12 L86 22 V55 C86 77 70 90 50 98 C30 90 14 77 14 55 V22 Z" fill="#8fc0e6"/>
  <path d="M50 16 L82 25 V55 C82 74 67 86 50 93 C33 86 18 74 18 55 V25 Z" fill="#ffffff"/>

  <!-- Graduation cap: head band, mortarboard, button -->
  <path d="M33 34 v9 c0 3.9 7.6 7 17 7 s17-3.1 17-7 v-9 l-17 5.6 z" fill="#e8f2fb" stroke="#0f3d68" stroke-width="2" stroke-linejoin="round"/>
  <path d="M50 21 L78 31 L50 41 L22 31 Z" fill="url(#capGrad)"/>
  <circle cx="50" cy="30.6" r="1.9" fill="#ffffff" stroke="#0f3d68" stroke-width="1.3"/>

  <!-- Tassel: cord draped over the left edge + tuft -->
  <path d="M50 30.6 C43 31.2 39.2 33.8 37.6 38.2" fill="none" stroke="#0f3d68" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M50 30.6 C43 31.2 39.2 33.8 37.6 38.2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M37.6 38 v6.4" stroke="#0f3d68" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M37.6 38 v6.4" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M35.4 44.4 h4.4 l-.8 5.4 h-2.8 z" fill="#ffffff" stroke="#0f3d68" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Checkmark swoosh wing (rises past the shield edge) -->
  <path d="M63 49 C73 38 83 30 93 26 C88.5 36.5 80.5 46 70.5 55 Z" fill="#4a90c2"/>

  <!-- Checkmark -->
  <path d="M26 50 L42 66 L74.5 33.5" fill="none" stroke="url(#checkGrad)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clock: navy bezel with tick ring, white face -->
  <circle cx="50" cy="76" r="14" fill="#0f3d68"/>
  <circle cx="50" cy="76" r="11.3" fill="none" stroke="#0f3d68" stroke-width="3" stroke-dasharray="1.75 4.19" stroke-linecap="round"/>
  <circle cx="50" cy="76" r="10" fill="#ffffff"/>

  <!-- Digital "09:00" — 7-segment digits -->
  <g fill="#0f3d68">
    <g transform="translate(41.41 72.6) scale(0.52)">
      <rect x="1.5" y="0" width="3" height="1.5"/><rect x="4.5" y="1.5" width="1.5" height="3"/>
      <rect x="4.5" y="5.5" width="1.5" height="3"/><rect x="1.5" y="8.5" width="3" height="1.5"/>
      <rect x="0" y="5.5" width="1.5" height="3"/><rect x="0" y="1.5" width="1.5" height="3"/>
    </g>
    <g transform="translate(45.38 72.6) scale(0.52)">
      <rect x="1.5" y="0" width="3" height="1.5"/><rect x="4.5" y="1.5" width="1.5" height="3"/>
      <rect x="4.5" y="5.5" width="1.5" height="3"/><rect x="1.5" y="8.5" width="3" height="1.5"/>
      <rect x="0" y="1.5" width="1.5" height="3"/><rect x="1.5" y="4.25" width="3" height="1.5"/>
    </g>
    <rect x="49.5" y="73.4" width="1.2" height="1.2"/>
    <rect x="49.5" y="76.1" width="1.2" height="1.2"/>
    <g transform="translate(51.5 72.6) scale(0.52)">
      <rect x="1.5" y="0" width="3" height="1.5"/><rect x="4.5" y="1.5" width="1.5" height="3"/>
      <rect x="4.5" y="5.5" width="1.5" height="3"/><rect x="1.5" y="8.5" width="3" height="1.5"/>
      <rect x="0" y="5.5" width="1.5" height="3"/><rect x="0" y="1.5" width="1.5" height="3"/>
    </g>
    <g transform="translate(55.47 72.6) scale(0.52)">
      <rect x="1.5" y="0" width="3" height="1.5"/><rect x="4.5" y="1.5" width="1.5" height="3"/>
      <rect x="4.5" y="5.5" width="1.5" height="3"/><rect x="1.5" y="8.5" width="3" height="1.5"/>
      <rect x="0" y="5.5" width="1.5" height="3"/><rect x="0" y="1.5" width="1.5" height="3"/>
    </g>
  </g>
  <text x="50" y="81.4" text-anchor="middle" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="3.6" font-weight="800" fill="#0f3d68" letter-spacing="0.4">AM</text>
</svg>
